<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tra cứu học phí</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
          integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
          crossorigin="anonymous"></script>
  <script type="module" src="js/public.js"></script>
</head>
<body>
  <div class="topbar"><div class="container topbar__inner"><span>Tra cứu học phí</span></div></div>
  <main class="container page page--narrow">
    <h1 class="section-title">Tra cứu học phí</h1>
    <form id="lookup-form" class="card">
      <label class="field">
        <span class="field__label">Họ và tên đầy đủ của con</span>
        <input id="student-name" type="text" name="student" autocomplete="off" autocapitalize="words" required placeholder="VD: Nguyễn Văn An">
        <span class="field__hint">Gõ có dấu, đúng như đã đăng ký với cô.</span>
      </label>
      <button type="submit" class="btn btn--primary btn--block">Tra cứu</button>
    </form>
    <div id="result" class="result"></div>
  </main>
</body>
</html>
